<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student | Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">

    <h1>Edit Student</h1>

    <form action="/edit/{{ student[0] }}" method="POST">


        <label for="roll_number">
            Roll Number
        </label>

        <input
            type="text"
            id="roll_number"
            name="roll_number"
            value="{{ student[5] or '' }}"
            required
        >


        <label for="name">
            Student Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            value="{{ student[1] }}"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            value="{{ student[2] }}"
            required
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ student[6] or '' }}"
            required
        >


        <label for="course">
            Course
        </label>

        <select id="course"
                name="course"
                required>

            <option value="">
                Select Course
            </option>

            <option value="CSE"
                {% if student[3] == "CSE" %}selected{% endif %}>
                Computer Science and Engineering
            </option>

            <option value="CSE (Data Science)"
                {% if student[3] == "CSE (Data Science)" %}selected{% endif %}>
                CSE (Data Science)
            </option>

            <option value="ECE"
                {% if student[3] == "ECE" %}selected{% endif %}>
                Electronics and Communication Engineering
            </option>

            <option value="EEE"
                {% if student[3] == "EEE" %}selected{% endif %}>
                Electrical and Electronics Engineering
            </option>

            <option value="Mechanical"
                {% if student[3] == "Mechanical" %}selected{% endif %}>
                Mechanical Engineering
            </option>

            <option value="Civil"
                {% if student[3] == "Civil" %}selected{% endif %}>
                Civil Engineering
            </option>

        </select>


        <label for="year">
            Academic Year
        </label>

        <select id="year"
                name="year"
                required>

            <option value="">
                Select Year
            </option>

            <option value="1st Year"
                {% if student[7] == "1st Year" %}selected{% endif %}>
                1st Year
            </option>

            <option value="2nd Year"
                {% if student[7] == "2nd Year" %}selected{% endif %}>
                2nd Year
            </option>

            <option value="3rd Year"
                {% if student[7] == "3rd Year" %}selected{% endif %}>
                3rd Year
            </option>

            <option value="4th Year"
                {% if student[7] == "4th Year" %}selected{% endif %}>
                4th Year
            </option>

        </select>


        <button type="submit">
            Update Student
        </button>

    </form>


    <br>

    <a href="/" class="back-button">
        Back to Dashboard
    </a>

</div>

</body>

</html>
