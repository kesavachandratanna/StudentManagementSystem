<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student | Student Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Add New Student</h1>

        <form action="/add" method="POST">

            <label for="roll_number">
                Roll Number
            </label>

            <input
                type="text"
                id="roll_number"
                name="roll_number"
                placeholder="Enter roll number"
                required
            >


            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
                required
            >


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
                required
            >


            <label for="course">
                Course
            </label>

            <select id="course"
                    name="course"
                    required>

                <option value="">
                    Select Course
                </option>

                <option value="CSE">
                    Computer Science and Engineering
                </option>

                <option value="CSE (Data Science)">
                    CSE (Data Science)
                </option>

                <option value="ECE">
                    Electronics and Communication Engineering
                </option>

                <option value="EEE">
                    Electrical and Electronics Engineering
                </option>

                <option value="Mechanical">
                    Mechanical Engineering
                </option>

                <option value="Civil">
                    Civil Engineering
                </option>

            </select>


            <label for="year">
                Academic Year
            </label>

            <select id="year"
                    name="year"
                    required>

                <option value="">
                    Select Year
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>


            <button type="submit">
                Add Student
            </button>

        </form>


        <br>

        <a href="/" class="back-button">
            Back to Dashboard
        </a>

    </div>

</body>

</html>
